name: Build Collage Studio Test Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'videos/**'
      - 'packaging/windows/**'
      - 'requirements-desktop.txt'
      - '.github/workflows/collage-test-build.yml'

permissions:
  contents: read

jobs:
  windows-test-build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install desktop dependencies
        run: python -m pip install -r requirements-desktop.txt

      - name: Build desktop executable
        run: python packaging/windows/build.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build unsigned test installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion="0.1.0-test" packaging/windows/installer-script.iss'

      - name: Upload unsigned test installer
        uses: actions/upload-artifact@v4
        with:
          name: CollageStudio-windows-test
          path: packaging/windows/dist/CollageStudioSetup.exe
          if-no-files-found: error
          retention-days: 14
