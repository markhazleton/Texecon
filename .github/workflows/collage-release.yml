name: Build Collage Studio Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-2022
    env:
      COLLAGE_STUDIO_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set release version
        shell: pwsh
        run: |
          $version = "${env:COLLAGE_STUDIO_VERSION}" -replace '^v', ''
          "COLLAGE_STUDIO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install desktop dependencies
        run: python -m pip install -r requirements-desktop.txt

      - name: Build desktop executable
        run: python packaging/windows/build.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion="$env:COLLAGE_STUDIO_VERSION" packaging/windows/installer-script.iss'

      - name: Require signing configuration
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'Public releases require WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD secrets.'
          }
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Sign installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP 'collage-signing.pfx'
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $installer = 'packaging/windows/dist/CollageStudioSetup.exe'
          signtool sign /fd SHA256 /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installer
          signtool verify /pa $installer
          Remove-Item $certPath -Force

      - name: Generate checksum
        shell: pwsh
        run: Get-FileHash packaging/windows/dist/CollageStudioSetup.exe -Algorithm SHA256 | ForEach-Object Hash | Set-Content packaging/windows/dist/CollageStudioSetup.exe.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.COLLAGE_STUDIO_VERSION }}
          name: Collage Studio v${{ env.COLLAGE_STUDIO_VERSION }}
          generate_release_notes: true
          files: |
            packaging/windows/dist/CollageStudioSetup.exe
            packaging/windows/dist/CollageStudioSetup.exe.sha256
