<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html;  charset=UTF-8" />
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAM</title>
    <link rel="stylesheet" href="/ok/media/dam/dam.css">
    <script async defer src="/ok/media/altcha/altcha.min.js" type="module"></script>
</head>
<body>
    <div id="altcha-content">
        <h1><img src="/ok/media/assets/public/images/gw/favicons/favicon.ico"> gateway.okhistory.org</h1>
        <h2>Validating your request...</h2>
        <div>
            <form id="altcha-submission">
                <input type="hidden" name="csrfmiddlewaretoken" value="XtcWaI6Qg7AHji9M5cechjtuatQgZEgiBfmCUC4pNqVB94i0tTgvAhbd3f43qBFs">
                <altcha-widget id="altcha"></altcha-widget>
            </form>
        </div>
        
            <h3>This may take several seconds. Please do not refresh this page. If you are unable to reach our site content, please <a href="https://gateway.okhistory.org/feedback/?cat=Technical+Issue&user_feedback=Altcha+Challenge+Issue+Details%3A">let us know</a>.</h3>
        
    </div>
    <script type="text/javascript">
        window.addEventListener("load", () => {
            document.querySelector("#altcha").configure({
                challenge: {
                    algorithm: "SHA-256",
                    challenge: "a1491ee5485b58dcd852d00ea9cbc7c0d31bc6fd4803205974d8809c41111fe1",
                    salt: "950ffef130e0b6685be8aff6?expires=1789409336",
                    signature: "13aa36f458c43eb4b60a3d12137a73ab600012c7c094573d732f1ff2104be42d",
                    maxnumber: "500000",
                },
                auto: "none",
                debug: false,
                delay: 0,
                hidefooter: true,
                hidelogo: false,
            });
        });
        document.querySelector("altcha-widget").addEventListener("statechange", async (e) => {
            await e.detail;
            if (e.detail.state === "verified") {
                const challengeData = new FormData(document.forms["altcha-submission"]);
                try {
                   const response = await fetch("/dam/submit/", {
                        method: "POST",
                        body: challengeData,
                    });
                    const result = await response.json();
                    if ("success" in result) {
                        window.location.replace("/search/?q\u003D%22Alfred+Hazelton%22\u0026t\u003Dfulltext");
                    } else {
                        document.getElementById('altcha-content').innerHTML = `${result.error} This may take several seconds. Please do not refresh this page. If you are unable to reach our site content, please <a href="https://gateway.okhistory.org/feedback/?cat=Technical+Issue&user_feedback=Altcha+Challenge+Issue+Details%3A">let us know</a>.`;
                    }
                } catch (error) {
                    document.getElementById('altcha-content').innerHTML = `${error} This may take several seconds. Please do not refresh this page. If you are unable to reach our site content, please <a href="https://gateway.okhistory.org/feedback/?cat=Technical+Issue&user_feedback=Altcha+Challenge+Issue+Details%3A">let us know</a>.`;
                    console.error("Challenge submission error:", error);
                }
            }
        });
    </script>
</body>
</html>
