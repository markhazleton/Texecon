owner: Mark Hazleton
lifecycle: current
root: scripts
managed_by: mixed
required_layers:
  - architecture.md
relations:
  - type: supports
    object: texecon-site
evidence:
  - type: code
    ref: scripts/fetch-content.js
    verified_by: inspection
    test_attempted: false
    fallback_reason: Build-script inspection
  - type: code
    ref: scripts/refresh-content.js
    verified_by: inspection
    test_attempted: false
    fallback_reason: Build-script inspection
  - type: code
    ref: client/src/lib/data.ts
    verified_by: inspection
    test_attempted: false
    fallback_reason: Consumer inspection
